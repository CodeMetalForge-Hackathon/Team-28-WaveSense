<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WaveSense"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>WaveSense</title><link rel="stylesheet" href="./style.css"></head><body>
<main class="phone" data-unit="operator"><header class="top"><div class="brand">WAVESENSE</div><div class="status"><span class="dot"></span><span>Rover 01</span><span class="badge">DEMO</span><button class="fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button></div></header><div class="sensor-tray" aria-label="Sensor previews"></div><div class="viewport"></div><section class="drive"><div class="stick-unit"><div class="joystick" data-stick="move" tabindex="0" role="group" aria-label="Move joystick. Release to stop."><span class="axis vertical"></span><span class="axis horizontal"></span><span class="direction north">↑</span><span class="direction south">↓</span><span class="direction west">←</span><span class="direction east">→</span><span class="stick"></span></div><span class="stick-label">Move</span></div><div class="drive-middle"><span class="command" role="status">Ready</span></div><div class="stick-unit"><div class="joystick" data-stick="turn" tabindex="0" role="group" aria-label="Turn joystick. Release to stop."><span class="axis vertical"></span><span class="axis horizontal"></span><span class="direction west">↶</span><span class="direction east">↷</span><span class="stick"></span></div><span class="stick-label">Turn</span></div></section></main>
<dialog class="install"><button class="close-help" aria-label="Close full screen help">×</button><h2>Open full screen</h2><p class="install-help">On iPhone: Share → Add to Home Screen → open WaveSense from its icon.</p><p class="secondary">On Android: browser menu → Install app or Add to Home screen. Use the robot’s HTTPS address when opening from another device.</p><button class="install-native" hidden>Install WaveSense</button></dialog><script src="./drive.js"></script><script>
const grid='<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#24363b" stroke-width=".6"/></pattern></defs><rect width="500" height="260" fill="url(#grid)"/>';
function svg(content){return '<svg class="viz" viewBox="0 0 500 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+content+'</svg>'}
const views={wifi:()=>'<div class="feed-offline"><span class="offline-symbol">⌁</span><span>Radar</span><small>Preview only · no sensor connected</small></div>' ,lidar:()=>'<span class="viewlabel">LOCAL OBSTACLE MAP</span><span class="sample">SIMULATED</span>'+svg(grid+'<path d="M65 45H208V78H420V215H315V180H65Z" fill="#1e2d31" stroke="#7f939a" stroke-width="3"/><path d="M250 175L156 60H347Z" fill="#c3fa70" opacity=".08"/><g fill="#c3fa70">'+Array.from({length:50},(_,i)=>'<circle cx="'+(85+i*6.3)+'" cy="'+(85+Math.sin(i*.5)*10)+'" r="1.6"/>').join('')+'</g><path d="M250 170V125" stroke="#c3fa70" stroke-width="2" stroke-dasharray="4 4"/><circle cx="250" cy="170" r="13" fill="#10191c" stroke="#c3fa70" stroke-width="2"/><path d="M250 159L244 172H256Z" fill="#c3fa70"/><text x="271" y="176" fill="#bccbce" font-size="11" font-family="monospace">ROVER</text>')+'<div class="viewfooter"><span>Obstacles only · local frame</span><span>2 m ━</span></div>',rgb:()=>'<span class="viewlabel">FRONT CAMERA</span><span class="sample">ILLUSTRATION</span>'+svg('<rect width="500" height="260" fill="#333f43"/><path d="M0 0H500L310 90H190Z" fill="#536065"/><path d="M0 260H500L310 170H190Z" fill="#202a2f"/><path d="M0 0L190 90V170L0 260Z" fill="#465257"/><path d="M500 0L310 90V170L500 260Z" fill="#2e3c40"/><rect x="190" y="90" width="120" height="80" fill="#141e23"/><path d="M55 35V224M110 63V200M390 61V201M445 35V223" stroke="#637176" stroke-width="3"/><path d="M220 212H280M250 195V229" stroke="#c3fa70" opacity=".65"/><path d="M15 44V22H39M485 44V22H461M15 218V238H39M485 218V238H461" stroke="#bdcacc" fill="none" opacity=".6"/>')+'<div class="viewfooter"><span>Camera feed not connected</span><span>RGB</span></div>',ir:()=>'<span class="viewlabel">INFRARED / THERMAL</span><span class="sample">ILLUSTRATION</span>'+svg('<defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="500" height="260" fill="#171e39"/><path d="M0 0L180 80V180L0 260ZM500 0L320 80V180L500 260Z" fill="#293658"/><path d="M0 260L180 180H320L500 260" fill="#39456a"/><g filter="url(#blur)"><ellipse cx="272" cy="135" rx="30" ry="52" fill="#9e426d"/><ellipse cx="272" cy="132" rx="18" ry="37" fill="#e9a46f"/><circle cx="272" cy="91" r="13" fill="#eed6a1"/></g><path d="M246 71H230V89M295 71H311V89M230 168V186H246M295 186H311V168" fill="none" stroke="#c8d0e4" opacity=".7"/>')+'<div class="viewfooter"><span>Sensor model to confirm · no temperature readout</span></div>'};
const sensorNames={ir:'Thermal',lidar:'LiDAR',wifi:'Radar',rgb:'Camera'};
function setMain(unit,key){unit.dataset.view=key;const view=unit.querySelector('.viewport');view.innerHTML=views[key]();view.querySelectorAll('.viewlabel,.viewfooter,.sample').forEach(el=>el.remove());view.insertAdjacentHTML('beforeend','<span class="main-title">'+sensorNames[key]+'</span><span class="demo-tag">DEMO</span>'+(key!=='rgb'?'<button class="back-camera" aria-label="Return to camera">↶ Camera</button>':''));if(key!=='rgb')view.querySelector('.back-camera').onclick=()=>setMain(unit,'rgb');unit.querySelectorAll('.sensor-card').forEach(c=>c.classList.toggle('selected',c.dataset.sensor===key));view.querySelector('.demo-tag').textContent=unit.dataset.live==='true'?(view.querySelector('.live-feed,.wifi-live,.lidar-live')?'LIVE':'OFFLINE'):'DEMO';const reading=unit.querySelector('.reading');if(reading)reading.textContent=sensorNames[key];}

const unit=document.querySelector('.phone');
const tray=unit.querySelector('.sensor-tray');
['ir','lidar','wifi'].forEach(key=>{const card=document.createElement('div');card.className='sensor-card';card.dataset.sensor=key;card.innerHTML='<button class="sensor-preview" aria-label="Show '+sensorNames[key]+' in main view">'+views[key]()+'<span class="sensor-name">'+sensorNames[key]+'</span></button><button class="float-open" aria-label="Float '+sensorNames[key]+' preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18L18 6M7 6H18V17" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>';card.querySelector('.sensor-preview').onclick=()=>{stopMotion();setMain(unit,key)};card.querySelector('.float-open').onclick=()=>{unit.querySelector('.floating')?.remove();const f=document.createElement('div');f.className='floating';f.innerHTML='<div class="float-head"><span>'+sensorNames[key]+'</span><button aria-label="Close floating sensor">×</button></div><div class="float-image">'+views[key]()+'</div>';f.querySelector('button').onclick=()=>f.remove();unit.querySelector('.viewport').appendChild(f)};tray.appendChild(card)});
setMain(unit,'rgb');
let activePointers=new Map(),keys=new Set();
const joysticks=[...document.querySelectorAll('.joystick')],joystick=joysticks[0],speed={value:'35'},command=document.querySelector('.command');
const vectors={move:{x:0,y:0},turn:{x:0,y:0}};
function emitDrive(){const v=DriveMath.motion(vectors.move,vectors.turn,.35,false);for(const name of ['vx','vy','wz'])unit.dataset[name]=v[name].toFixed(3);unit.dataset.linear=v.vx.toFixed(3);unit.dataset.angular=v.wz.toFixed(3);if(unit.dataset.live!=='true')command.textContent=Math.abs(v.vx)+Math.abs(v.vy)+Math.abs(v.wz)<.001?'Ready':'Moving';window.dispatchEvent(new CustomEvent('wavesense:drive',{detail:v}));}
function paint(){joysticks.forEach(j=>{const v=vectors[j.dataset.stick],radius=j.clientWidth/2-25;j.querySelector('.stick').style.transform='translate('+v.x*radius+'px,'+v.y*radius+'px)'});emitDrive()}
function stopMotion(){activePointers.clear();keys.clear();vectors.move={x:0,y:0};vectors.turn={x:0,y:0};paint()}
joysticks.forEach(j=>{const name=j.dataset.stick;j.addEventListener('contextmenu',e=>e.preventDefault());function update(e){const r=j.getBoundingClientRect(),radius=r.width/2-25;vectors[name]=DriveMath.vector((e.clientX-r.left-r.width/2)/radius,name==='turn'?0:(e.clientY-r.top-r.height/2)/radius);paint()}j.onpointerdown=e=>{if([...activePointers.values()].includes(name))return;e.preventDefault();activePointers.set(e.pointerId,name);try{j.setPointerCapture(e.pointerId)}catch{}update(e)};j.onpointermove=e=>{if(activePointers.get(e.pointerId)===name)update(e)};const release=e=>{if(activePointers.get(e.pointerId)===name){activePointers.delete(e.pointerId);vectors[name]={x:0,y:0};paint()}};j.onpointerup=release;j.onpointercancel=release;j.onlostpointercapture=release});
function releasePointer(e){const name=activePointers.get(e.pointerId);if(name){activePointers.delete(e.pointerId);vectors[name]={x:0,y:0};paint()}}
window.addEventListener('pointerup',releasePointer,true);window.addEventListener('pointercancel',releasePointer,true);
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',a:'turnleft',d:'turnright'};function keyVectors(){vectors.move=DriveMath.vector(Number(keys.has('right'))-Number(keys.has('left')),Number(keys.has('down'))-Number(keys.has('up')));vectors.turn={x:Number(keys.has('turnright'))-Number(keys.has('turnleft')),y:0};paint()}
window.addEventListener('keydown',e=>{if(e.target.matches('input')||document.querySelector('dialog[open]'))return;if(e.code==='Space'){e.preventDefault();stopMotion();return}if(keymap[e.key]){e.preventDefault();keys.add(keymap[e.key]);keyVectors()}});window.addEventListener('keyup',e=>{if(keymap[e.key]){e.preventDefault();keys.delete(keymap[e.key]);keyVectors()}});
['blur','pagehide','resize'].forEach(event=>window.addEventListener(event,stopMotion));document.addEventListener('visibilitychange',stopMotion);document.addEventListener('fullscreenchange',()=>{stopMotion();document.querySelector('.fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit full screen':'Enter full screen')});
let installPrompt=null;const help=document.querySelector('.install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.querySelector('.install-native').hidden=false});document.querySelector('.install-native').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;help.close()}};
document.querySelector('.fullscreen').onclick=async()=>{stopMotion();if(document.fullscreenElement){await document.exitFullscreen();return}if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){return}try{if(document.documentElement.requestFullscreen&&document.fullscreenEnabled){await document.documentElement.requestFullscreen({navigationUI:'hide'});return}}catch(e){/* Installed mode is the alternative when browser fullscreen is unavailable. */}help.showModal()};document.querySelector('.close-help').onclick=()=>help.close();help.addEventListener('close',stopMotion);emitDrive();
</script><script src="./control.js"></script><script src="./lidar.js"></script><script type="module" src="./cloud3d.js"></script><script src="./evidence.js"></script><script src="./person_overlay.js"></script><script src="./live.js"></script></body></html>
